<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dy="4" result="blurred"/>
      <feFlood flood-color="#3c1e0a" flood-opacity="0.15" result="color"/>
      <feComposite in="color" in2="blurred" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="blur2"/>
      <feOffset in="blur2" dy="0.5" result="blurred2"/>
      <feFlood flood-color="#3c1e0a" flood-opacity="0.08" result="color2"/>
      <feComposite in="color2" in2="blurred2" operator="in" result="shadow2"/>
      <feMerge>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(28,28) rotate(-3)" filter="url(#shadow)">
    <rect x="-19" y="-19" width="38" height="38" rx="8" fill="#2e1a0e"/>
    <text
      x="0" y="5"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-style="italic"
      font-size="16"
      font-weight="400"
      fill="#faf3e8"
      letter-spacing="-0.3"
    >je·jo</text>
  </g>
</svg>
